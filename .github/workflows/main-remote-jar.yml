name: Build and Run Remote Jar OpenAICodeReview

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  download-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 检出最后两个提交，以便可以比较 HEAD~1 和 HEAD

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # 你可以选择其他发行版，如 'adopt' 或 'zulu'
          java-version: '21'

      - name: Download openai-code-review-sdk JAR
        # jar 下载地址通过 GitHub Secrets 配置（JAR_DOWNLOAD_URL），
        # 经 env 块注入避免 URL 出现在命令行中；-O 固定输出文件名，与后续执行路径对齐
        env:
          JAR_DOWNLOAD_URL: ${{ secrets.JAR_DOWNLOAD_URL }}
        run: |
          mkdir -p ./libs
          # -nv 保留下载日志便于排查；URL 必须加引号，防止含 & 的签名地址被 shell 截断
          wget -nv -O ./libs/openai-code-review-sdk.jar "$JAR_DOWNLOAD_URL"
          # 校验产物是合法 jar（zip 魔数 PK）：若下载到的是 HTML 错误页/登录页，在这里直接失败并暴露内容
          if ! head -c 2 ./libs/openai-code-review-sdk.jar | grep -q "PK"; then
            echo "::error::下载的文件不是有效的 jar，请检查 JAR_DOWNLOAD_URL 是否为资产直链"
            ls -la ./libs
            echo "--- 文件头部内容（前 500 字节） ---"
            head -c 500 ./libs/openai-code-review-sdk.jar
            exit 1
          fi

      - name: Run CodeReview
        # 配置全部通过环境变量注入 SDK，敏感信息均从 GitHub Secrets 读取，禁止硬编码
        run: java -jar ./libs/openai-code-review-sdk.jar
        env:
          # 阿里云百炼配置：MAAS_WORKSPACE_ID 为工作空间 ID，DASHSCOPE_API_KEY 为接口密钥
          MAAS_WORKSPACE_ID: ${{ secrets.MAAS_WORKSPACE_ID }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # GitHub 配置：GITHUB_REVIEW_LOG_URI 为评审日志仓库地址（如 https://github.com/xxx/openai-code-review-log.git），
          # GITHUB_TOKEN 为具有该仓库写权限的 PAT（https://github.com/settings/tokens）
          GITHUB_REVIEW_LOG_URI: ${{ secrets.CODE_REVIEW_LOG_URI }}
          GITHUB_TOKEN: ${{ secrets.CODE_TOKEN }}
          # 评审日志的提交人身份与项目标识
          CODE_REVIEW_AUTHOR: ${{ secrets.AUTHOR }}
          CODE_REVIEW_EMAIL: ${{ secrets.EMAIL }}
          CODE_REVIEW_PROJECT: ${{ secrets.PROJECT }}
